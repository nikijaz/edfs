[package]
name = "edfs"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[dependencies]
async-fuser = "0.17.0"
async-trait = "0.1"
bincode-next = { version = "3.0.0-rc", features = ["serde"] }
crdt_tree = "0.0.16"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastcdc = "4.0.1"
libp2p = { version = "0.56.0", features = [
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "request-response",
    "cbor",
    "tokio",
    "macros",
    "ed25519",
    "serde",
] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
parking_lot = "0.12.5"
rand = "0.10.1"
serde = "1.0.228"
sha2 = "0.11.0"
tracing = "0.1"
tokio = { version = "1.52.2", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
uuid = { version = "1.23.1", features = ["v5", "serde"] }
